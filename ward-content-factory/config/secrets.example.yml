# ward-content-factory — ключи доступа (ОБРАЗЕЦ)
#
# 🔴 Как пользоваться:
#   1. Скопируй этот файл рядом под именем secrets.yml (config/secrets.yml).
#   2. Замени все xxx на свои значения.
#   3. secrets.yml НЕ коммитить: он уже в .gitignore. В репозитории живёт только этот образец.
#
# Один файл ключей на весь завод. Соседние скиллы (parsing-ward, zernio-posting)
# могут иметь свои secrets.yml — мастер настройки подскажет, если значения расходятся.
# Вместо файла можно задать переменные окружения (имя указано справа) — они важнее файла.

teable:
  api_token: "teable_xxx"            # env: TEABLE_API_TOKEN · Teable → аватар → Personal access token (права: чтение и запись записей и полей базы)

zernio:
  api_key: "sk_xxx"                  # env: ZERNIO_API_KEY · zernio.com → Settings → API Keys

heygen:
  api_key: "xxx"                     # env: HEYGEN_API_KEY · app.heygen.com → Settings → API

# Higgsfield подключается как MCP-сервер в Claude (ключ хранится в настройках Claude, не здесь).
# Как проверить подключение — workflows/setup.md, шаг 4.
